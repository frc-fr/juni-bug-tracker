<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>État du traitement · JunOS Bug Tracker</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1><span class="brand">JunOS</span> Bug Tracker</h1>
      <p class="muted"><a href="./" data-text="status.back"></a>&emsp;<button type="button" id="language" class="theme" data-text="language.switch" data-label="language.title"></button></p>
    </div>
  </header>

  <main class="wrap legal report">
    <h2 data-text="status.title"></h2>
    <p data-text="status.intro"></p>
    <div id="report"><p class="muted" data-text="status.loading"></p></div>
  </main>

  <footer class="wrap muted">
    <p data-html="footer.credit"></p>
  </footer>
  <script src="i18n.js"></script>
  <script src="status.js"></script>
</body>
</html>
